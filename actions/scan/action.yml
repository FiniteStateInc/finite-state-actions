name: 'Finite State Scan'
description: 'Scan project dependencies with fs-cli and upload results to the Finite State platform'
author: 'Finite State Inc.'
branding:
  icon: 'search'
  color: 'blue'
inputs:
  api-token:
    description: 'Finite State API token. Only needed when the setup action did not run in this job.'
    required: false
  domain:
    description: 'Finite State platform domain. Defaults to the setup context, then app.finitestate.io.'
    required: false
  project-name:
    description: 'Project name sent to the platform. Alias for name; the platform creates the project if it does not exist.'
    required: false
  dir:
    description: 'Directory to scan'
    required: false
    default: '.'
  project-id:
    description: 'Project ID (UUID) or name. Overrides value from setup.'
    required: false
  version:
    description: 'Version label for the scan (e.g. v1.2.3 or pr-42)'
    required: true
  name:
    description: 'Project name sent to the platform. Defaults to the repository name from GITHUB_REPOSITORY.'
    required: false
  extra-args:
    description: 'Additional arguments passed to fs-cli scan'
    required: false
outputs:
  exit-code:
    description: 'Exit code from fs-cli scan'
runs:
  using: 'node24'
  main: 'dist/index.js'
