name: 'Finite State Download SBOM'
description: 'Export CycloneDX or SPDX SBOM from Finite State with optional artifact upload'
author: 'Finite State Inc.'
branding:
  icon: 'download'
  color: 'blue'
inputs:
  api-token:
    description: 'Finite State API token. Only needed when the setup action did not run in this job.'
    required: false
  domain:
    description: 'Finite State platform domain. Defaults to the setup context, then app.finitestate.io.'
    required: false
  version-id:
    description: 'Version ID override (falls back to setup context). Skips the name lookups and outranks project-name/version.'
    required: false
  project-id:
    description: 'Platform project ID (a signed 64-bit integer, not a UUID), used with version when no version-id is known. Skips the name lookup and outranks project-name. Falls back to the setup context.'
    required: false
  project-name:
    description: 'Project name, resolved by fs-cli. Used with version when no version-id is known. Falls back to the setup context.'
    required: false
  version:
    description: 'Version label, resolved by fs-cli against the version name or number. Requires project-id or project-name (or a setup context carrying the project). Beats a version ID inherited from an upstream scan or upload; only an explicit version-id input takes precedence.'
    required: false
  format:
    description: 'SBOM format: cyclonedx (alias cdx) or spdx. Case-insensitive; an unrecognized value fails the step rather than reaching fs-cli.'
    required: false
    default: 'cyclonedx'
  max-size:
    description: 'Reject an SBOM larger than this many MiB. Unset uses fs-cli default of 64. Raise it for a version whose SBOM exceeds that, which the REST path this replaced did not limit.'
    required: false
  timeout:
    description: 'Optional maximum wait in seconds for the export, rounded up to whole minutes for fs-cli. Unset leaves fs-cli its own 15-minute default.'
    required: false
  include-vex:
    description: 'Include VEX data in the SBOM export'
    required: false
    default: 'true'
  output-file:
    description: 'Output file path for the downloaded SBOM'
    required: false
    default: 'sbom.json'
  upload-artifact:
    description: 'Upload the SBOM as a workflow artifact'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name of the workflow artifact'
    required: false
    default: 'finite-state-sbom'
outputs:
  file:
    description: 'Path to the downloaded SBOM file'
  artifact-name:
    description: 'Artifact name — set even when upload-artifact is false'
  component-count:
    description: 'Number of entries in the SBOM — CycloneDX components or SPDX packages. Not comparable across formats: SPDX usually counts the describing package too, CycloneDX omits metadata.component and nested components. 0 with a warning when the file cannot be parsed or carries neither array.'
runs:
  using: 'node24'
  main: 'dist/index.js'
