name: 'Finite State Upload Scan (deprecated)'
description: 'Deprecated alias for the upload action. Use FiniteStateInc/finite-state-actions/actions/upload instead.'
author: 'Finite State Inc.'
branding:
  icon: 'upload-cloud'
  color: 'gray'
inputs:
  api-token:
    description: 'Finite State API token. Only needed when the setup action did not run in this job.'
    required: false
  domain:
    description: 'Finite State platform domain. Defaults to the setup context, then app.finitestate.io.'
    required: false
  type:
    description: 'Scan type: sca, sast, config, vulnerability-analysis, sbom, third-party'
    required: true
  file:
    description: 'Path to the file to upload'
    required: true
  project-id:
    description: 'Project ID override (falls back to setup context)'
    required: false
  project-name:
    description: 'Project name. Created if no project matches. Ignored when project-id is set.'
    required: false
  project-type:
    description: 'Deprecated and ignored — fs-cli creates the project and the platform assigns its type.'
    required: false
  version:
    description: 'Version name — creates a new version (mutually exclusive with version-id)'
    required: false
  version-id:
    description: 'Existing version ID (mutually exclusive with version)'
    required: false
  scanner-type:
    description: 'Scanner type for third-party scans (e.g. grype, trivy)'
    required: false
  sbom-format:
    description: 'SBOM format: cdx or spdx'
    required: false
  wait-for-completion:
    description: 'Poll until the scan finishes. Off by default — the upload returns as soon as the file is accepted.'
    required: false
    default: 'false'
  timeout:
    description: 'Optional maximum wait in seconds, applied to the upload and (with wait-for-completion) to the scan poll. Unset leaves fs-cli its own 30-minute default.'
    required: false
outputs:
  version-id:
    description: 'ID of the project version'
    value: ${{ steps.upload.outputs.version-id }}
  scan-status:
    description: 'Scan rollup for the version (COMPLETED, FAILED, RUNNING, NOT_FOUND, or SUBMITTED)'
    value: ${{ steps.upload.outputs.scan-status }}
runs:
  using: 'composite'
  steps:
    - name: Deprecation notice
      shell: bash
      run: |
        echo "::warning title=Deprecated action::actions/upload-scan is deprecated and will be removed in v3. Switch to FiniteStateInc/finite-state-actions/actions/upload@v2 — same inputs and outputs."

    - name: Upload
      id: upload
      uses: FiniteStateInc/finite-state-actions/actions/upload@v2
      with:
        api-token: ${{ inputs.api-token }}
        domain: ${{ inputs.domain }}
        type: ${{ inputs.type }}
        file: ${{ inputs.file }}
        project-id: ${{ inputs.project-id }}
        project-name: ${{ inputs.project-name }}
        project-type: ${{ inputs.project-type }}
        version: ${{ inputs.version }}
        version-id: ${{ inputs.version-id }}
        scanner-type: ${{ inputs.scanner-type }}
        sbom-format: ${{ inputs.sbom-format }}
        wait-for-completion: ${{ inputs.wait-for-completion }}
        timeout: ${{ inputs.timeout }}
