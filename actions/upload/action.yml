name: 'Finite State Upload'
description: 'Upload firmware, SBOMs, or third-party scan results to Finite State'
author: 'Finite State Inc.'
branding:
  icon: 'upload-cloud'
  color: 'blue'
inputs:
  api-token:
    description: 'Finite State API token. Only needed when the setup action did not run in this job.'
    required: false
  domain:
    description: 'Finite State platform domain. Defaults to the setup context, then app.finitestate.io.'
    required: false
  type:
    description: 'Scan type, or a comma-separated list: sca, sast, config, vulnerability-analysis, sbom, third-party'
    required: true
  file:
    description: 'Path to the file to upload. A glob is allowed if it matches exactly one file.'
    required: true
  project-id:
    description: 'Project ID override (falls back to setup context)'
    required: false
  project-name:
    description: 'Project name. Created if no project matches. Ignored when project-id is set.'
    required: false
  project-type:
    description: 'Deprecated and ignored — fs-cli creates the project and the platform assigns its type.'
    required: false
  version:
    description: 'Version name — creates a new version (mutually exclusive with version-id)'
    required: false
  version-id:
    description: 'Existing version ID (mutually exclusive with version)'
    required: false
  scanner-type:
    description: 'Scanner type for third-party scans (e.g. grype, trivy)'
    required: false
  sbom-format:
    description: 'SBOM format: cdx or spdx'
    required: false
  wait-for-completion:
    description: 'Poll until scan is done'
    required: false
    default: 'true'
  timeout:
    description: 'Maximum wait time in seconds, applied to the upload and (with wait-for-completion) to the scan poll'
    required: false
    default: '600'
outputs:
  version-id:
    description: 'ID of the project version'
  scan-status:
    description: 'Scan rollup for the version: COMPLETED, FAILED, RUNNING, NOT_FOUND, or SUBMITTED when wait-for-completion is false'
runs:
  using: 'node24'
  main: 'dist/index.js'
