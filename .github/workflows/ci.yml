name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/core run build
      - run: pnpm typecheck

  # Every OS a GitHub-hosted runner offers, because all eight actions run on all
  # three and nothing else checked that. Windows is the reason this is a matrix:
  # the wait action used to be a composite shelling out to bash, which on
  # Windows means Git Bash, and it is now node24 like the rest.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/core run build
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Two checks, because neither alone catches a missing bundle. This one
      # compares what is on disk against what is committed, and uses git status
      # rather than git diff because the root .gitignore lists dist/ and *.js:
      # git diff reports nothing for a file git does not track yet, so a new
      # action's bundle would look fine while being absent from the release.
      - name: Verify dist/ files are up-to-date and tracked
        run: |
          if [ -n "$(git status --porcelain --ignored=matching actions/*/dist/)" ]; then
            echo "::error::dist/ files are out of date or untracked. Run 'pnpm build', then 'git add -f' any new action's dist/ and commit."
            git status --porcelain --ignored=matching actions/*/dist/
            exit 1
          fi

      # And this one names the actions it expects a bundle for, rather than
      # globbing for whatever exists: actions/*/dist/ contributes no path at all
      # for an action whose dist/ was never created, so the check above would
      # pass while that action ships with no entry point.
      - name: Verify every bundled action has a tracked bundle
        run: |
          missing=0
          for manifest in actions/*/action.yml; do
            action="$(dirname "$manifest")"
            grep -q "using: 'node" "$manifest" || continue
            if ! git ls-files --error-unmatch "$action/dist/index.js" > /dev/null 2>&1; then
              echo "::error::$action declares a Node runtime but has no tracked $action/dist/index.js. Run 'pnpm build', then 'git add -f $action/dist'."
              missing=1
            fi
          done
          exit $missing
