name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/core run build
      - run: pnpm typecheck

  # Every OS a GitHub-hosted runner offers, because all eight actions run on all
  # three and nothing else checked that. Windows is the reason this is a matrix:
  # the wait action used to be a composite shelling out to bash, which on
  # Windows means Git Bash, and it is now node24 like the rest.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/core run build
      - run: pnpm test

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # git status, not git diff: the root .gitignore lists dist/ and *.js, so a
      # new action's bundle starts out untracked, and git diff reports nothing
      # for a file git does not track yet. That would ship an action with no
      # dist/index.js and a green build.
      - name: Verify dist/ files are up-to-date and tracked
        run: |
          if [ -n "$(git status --porcelain --ignored=matching actions/*/dist/)" ]; then
            echo "::error::dist/ files are out of date or untracked. Run 'pnpm build', then 'git add -f' any new action's dist/ and commit."
            git status --porcelain --ignored=matching actions/*/dist/
            exit 1
          fi
