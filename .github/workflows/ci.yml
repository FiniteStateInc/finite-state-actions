name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/core run build
      - run: pnpm typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C packages/core run build
      - run: pnpm test

  # actions/wait is a composite action with no package.json, so pnpm -r skips
  # it and its checks are a shell script. macOS is in the matrix because it
  # ships bash 3.2, where `set -u` treats an empty array expansion as an error —
  # the case wait.sh guards against and ubuntu's bash 5 would never catch.
  wait-action:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - run: bash --version
      - run: bash actions/wait/__tests__/action.test.sh
      - name: shellcheck
        run: shellcheck actions/wait/wait.sh actions/wait/__tests__/action.test.sh
        if: matrix.os == 'ubuntu-latest'

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test, wait-action]
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify dist/ files are up-to-date
        run: |
          if [ -n "$(git diff --name-only actions/*/dist/)" ]; then
            echo "::error::dist/ files are out of date. Run 'pnpm build' and commit the changes."
            git diff --stat actions/*/dist/
            exit 1
          fi
